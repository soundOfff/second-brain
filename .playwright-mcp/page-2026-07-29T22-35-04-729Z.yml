                - text: ). Karpathy's MenuGen payment bug — the agent matched Stripe purchases to Google logins by
                - strong [ref=f9e318]: email address
                - text: instead of using a
                - strong [ref=f9e319]: persistent user ID
                - text: — is "plausible code, but bad system design"
                - link "[1]" [ref=f9e320] [cursor=pointer]:
                  - /url: /wiki/source/2026-06-24-sequoia-ascent-2026-summary
                - text: . The frontier skill is
                - strong [ref=f9e321]: not
