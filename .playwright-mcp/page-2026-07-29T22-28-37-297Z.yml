                - text: . The unit of work shifts from typing lines to delegating "macro actions" (implement a feature, refactor a subsystem, research a library) — the programmer becomes an
                - strong [ref=f2e333]: orchestrator of agents
                - link "[2026-06-24-sequoia-ascent-2026-summary]" [ref=f2e334] [cursor=pointer]:
                  - /url: /wiki/source/2026-06-24-sequoia-ascent-2026-summary
                - text: .
              - heading "Why human judgment stays essential" [level=4] [ref=f2e335]
              - paragraph [ref=f2e336]:
                - text: Agents are spiky (
                - link "concepts/jagged-intelligence" [ref=f2e337] [cursor=pointer]:
