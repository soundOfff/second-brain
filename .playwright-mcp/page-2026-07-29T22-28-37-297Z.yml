                  - text: .
              - paragraph [ref=f2e330]:
                - text: The agentic engineer does not blindly accept generated code. They
                - strong [ref=f2e331]: design specs, supervise plans, inspect diffs, write tests, build evaluation loops, manage permissions, isolate worktrees, and preserve quality
                - link "[2026-06-24-sequoia-ascent-2026-summary]" [ref=f2e332] [cursor=pointer]:
