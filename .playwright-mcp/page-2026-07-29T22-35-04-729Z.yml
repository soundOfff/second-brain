              - paragraph [ref=f9e310]:
                - text: The agentic engineer does not blindly accept generated code. They
                - strong [ref=f9e311]: design specs, supervise plans, inspect diffs, write tests, build evaluation loops, manage permissions, isolate worktrees, and preserve quality
                - link "[1]" [ref=f9e312] [cursor=pointer]:
                  - /url: /wiki/source/2026-06-24-sequoia-ascent-2026-summary
                - text: . The unit of work shifts from typing lines to delegating "macro actions" (implement a feature, refactor a subsystem, research a library) — the programmer becomes an
                - strong [ref=f9e313]: orchestrator of agents
                - link "[1]" [ref=f9e314] [cursor=pointer]:
                  - /url: /wiki/source/2026-06-24-sequoia-ascent-2026-summary
                - text: .
              - heading "Why human judgment stays essential" [level=4] [ref=f9e315]
              - paragraph [ref=f9e316]:
                - text: Agents are spiky (
                - link "Jagged Intelligence" [ref=f9e317] [cursor=pointer]:
